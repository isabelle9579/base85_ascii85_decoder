[project]
name = "base85-ascii85-decoder"
version = "0.1.0"
description = "Encodes and decodes Ascii85 encoding, the format used in Adobe PostScript and PDF."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
